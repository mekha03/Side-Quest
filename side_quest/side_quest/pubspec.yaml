name: side_quest
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
  - assets/

  fonts:
  - family: Gotcha
    fonts:
      - asset: assets/fonts/Hey Gotcha Regular.otf
    
  - family: ChunkFive
    fonts:
      - asset: assets/fonts/chunkfive.regular.ttf
